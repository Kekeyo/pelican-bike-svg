<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的海岸骑行 · Pelican Cruise</title>
<style>
:root{color-scheme:light;--ink:#233e43;--cycle:1.2s}
*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:32px}main{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:13px;font-weight:700;letter-spacing:3px}.issue{font-size:11px;letter-spacing:2px;color:#71817b}.scene{position:relative;overflow:hidden;border-radius:26px;background:#dcece4;box-shadow:0 20px 70px #344f4210}h1{margin:0;font-size:clamp(30px,5vw,59px);letter-spacing:-2px;line-height:1.1;font-weight:600}.intro{position:absolute;left:5%;top:8%;z-index:1;pointer-events:none}.intro p{font-size:13px;letter-spacing:2px;color:#617c72;margin:15px 0}.tag{display:inline-block;font-size:10px;letter-spacing:2px;padding:7px 11px;border:1px solid #a9c6b8;border-radius:30px;margin-bottom:17px}svg{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:23px;font-size:12px;color:#71817b}.caption{letter-spacing:1px}.controls{display:flex;align-items:center;gap:18px}button{border:1px solid #c5cfc5;border-radius:30px;padding:10px 18px;background:transparent;color:var(--ink);cursor:pointer;font:inherit}button:hover{background:#e6ebdf}button:focus-visible{outline:3px solid #de884a;outline-offset:4px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#da884c;margin-right:8px}
/* All moving elements are SVG groups. Explicit SVG coordinates anchor rotations. */
.wheel{animation:spin var(--cycle) linear infinite;transform-box:view-box}.rear{transform-origin:305px 420px}.front{transform-origin:585px 420px}.crank{transform-origin:440px 398px;animation:spin var(--cycle) linear infinite}.pedal-a{transform-origin:470px 398px;animation:counter var(--cycle) linear infinite}.pedal-b{transform-origin:410px 398px;animation:counter var(--cycle) linear infinite}.rider{animation:bob .6s ease-in-out infinite}.wing{transform-origin:423px 287px;animation:wing 1.2s ease-in-out infinite}.scarf{transform-origin:487px 257px;animation:flutter .6s ease-in-out infinite}.shadow{transform-origin:445px 506px;animation:shadow .6s ease-in-out infinite}.road{animation:travel 1.8s linear infinite}.clouds{animation:travel 24s linear infinite}.leg-near{animation:pedalNear var(--cycle) linear infinite}.leg-far{animation:pedalFar var(--cycle) linear infinite}.paused *{animation-play-state:paused!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes counter{to{transform:rotate(-360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes wing{50%{transform:rotate(-3deg)}}@keyframes flutter{50%{transform:rotate(6deg)}}@keyframes shadow{50%{transform:scaleX(.97);opacity:.7}}@keyframes travel{to{transform:translateX(-360px)}}
/* The toes follow the same four quarter-turn positions as the pedal crank. */
@keyframes pedalNear{0%,100%{d:path('M 427 323 Q 475 343 470 398')}25%{d:path('M 427 323 Q 469 371 440 428')}50%{d:path('M 427 323 Q 403 358 410 398')}75%{d:path('M 427 323 Q 465 337 440 368')}}
@keyframes pedalFar{0%,100%{d:path('M 409 321 Q 386 357 410 398')}25%{d:path('M 409 321 Q 445 331 440 368')}50%{d:path('M 409 321 Q 463 344 470 398')}75%{d:path('M 409 321 Q 454 370 440 428')}}
@media(max-width:600px){body{padding:18px}.issue{display:none}.intro{top:6%}.tag{display:none}.intro p{font-size:10px;margin-top:7px;letter-spacing:1px}h1{font-size:30px}.scene{border-radius:18px}footer{align-items:flex-start}.caption{font-size:10px;line-height:1.8}.controls{gap:0}.controls>span{display:none}button{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){.scene *{animation-play-state:paused!important}}
</style>
</head>
<body>

<header><div class="brand">PELICAN / CLUB</div><div class="issue">COASTAL RIDE — NO. 006</div></header>
<section class="scene" aria-label="卡通鹈鹕骑自行车的动画">
<div class="intro"><span class="tag">THE SLOW LIFE SERIES</span><h1>顺着海风，<br>慢慢骑。</h1><p>A little ride. A lovely day.</p></div>

</section>
<footer><span class="caption">海岸骑行日记 &nbsp; / &nbsp; 今天也要轻轻松松。</span><div class="controls"><span><i class="dot"></i>ON A LITTLE ADVENTURE</span><button type="button" id="toggle" aria-pressed="false">暂停动画</button></div></footer>
</main>
<script>
// JavaScript only toggles playback; all animation is driven by CSS keyframes.
const button=document.getElementById('toggle');
const scene=document.querySelector('.scene');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
if(reduced.matches){button.textContent='已减少动态';button.disabled=true;}
button.addEventListener('click',()=>{const paused=scene.classList.toggle('paused');button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'继续骑行':'暂停动画';});
</script>
</body>
</html>
